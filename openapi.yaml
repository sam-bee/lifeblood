openapi: 3.0.3
info:
  title: Lifeblood
  version: 0.2.0
  description: Single-person health-data REST API. All end dates are exclusive.
servers:
  - url: https://lifeblood.personalinfra.co.uk
security:
  - bearer: []
paths:
  /eufy/connection:
    get:
      operationId: getEufyConnection
      description: Configuration and cache status; does not call Eufy.
      responses:
        '200': {description: Eufy connection status, cache freshness and optional retry_at}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /eufy/members:
    get:
      operationId: getEufyMembers
      description: Member IDs, names and default flags from the most recent cloud login.
      responses:
        '200': {description: source, data array of members, and cache metadata}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {description: Eufy unavailable or malformed response; observe Retry-After}
        '503': {description: Eufy credentials absent or rejected; observe Retry-After}
  /eufy/devices:
    get:
      operationId: getEufyDevices
      responses:
        '200': {description: source, data array of device IDs and names, and cache metadata}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '502': {description: Eufy unavailable or malformed response; observe Retry-After}
        '503': {description: Eufy credentials absent or rejected; observe Retry-After}
  /eufy/latest-weight:
    get:
      operationId: getEufyLatestWeight
      description: Latest available weigh-in for the default or sole member, or the specified customer_id. Shares the five-minute snapshot with all Eufy data routes.
      parameters:
        - {$ref: '#/components/parameters/eufyCustomer'}
      responses:
        '200':
          description: Latest available weight and body composition; measurement time and cache fetch time are separate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: {type: string, enum: [eufy]}
                  cache: {$ref: '#/components/schemas/EufyCache'}
                  data: {$ref: '#/components/schemas/EufyMeasurement'}
        '400': {description: Invalid customer ID or ambiguous account requires customer_id}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown customer or no weight reading}
        '502': {description: Eufy unavailable or malformed response; observe Retry-After}
        '503': {description: Eufy credentials absent or rejected; observe Retry-After}
  /eufy/measurements:
    get:
      operationId: getEufyMeasurements
      description: Available cloud history, newest first. All filtering and pagination use the shared five-minute snapshot. End dates are exclusive; no dates selects all available records. Offsets may shift after a refresh.
      parameters:
        - {$ref: '#/components/parameters/eufyCustomer'}
        - {name: start, in: query, schema: {type: string, format: date}, description: Inclusive UTC date}
        - {name: end, in: query, schema: {type: string, format: date}, description: Exclusive UTC date}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        '200':
          description: Available measurements with local pagination and cache metadata. Not a guarantee of complete historical coverage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: {type: string, enum: [eufy]}
                  cache: {$ref: '#/components/schemas/EufyCache'}
                  total: {type: integer}
                  next_offset: {type: integer, nullable: true}
                  skipped_records: {type: integer, description: Upstream records without a member, scale data or timestamp}
                  data: {type: array, items: {$ref: '#/components/schemas/EufyMeasurement'}}
        '400': {description: Invalid filters or pagination}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown customer}
        '502': {description: Eufy unavailable or malformed response; observe Retry-After}
        '503': {description: Eufy credentials absent or rejected; observe Retry-After}
  /oura/daily:
    get:
      operationId: getDailyMetrics
      parameters:
        - {$ref: '#/components/parameters/start'}
        - {$ref: '#/components/parameters/end'}
        - {$ref: '#/components/parameters/cursor'}
      responses:
        '200': {$ref: '#/components/responses/Records'}
        '400': {description: Invalid or out-of-bounds range or cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Oura is not connected}
  /oura/sleep:
    get:
      operationId: getSleep
      parameters:
        - {$ref: '#/components/parameters/start'}
        - {$ref: '#/components/parameters/end'}
        - {$ref: '#/components/parameters/cursor'}
      responses:
        '200': {$ref: '#/components/responses/Records'}
        '400': {description: Invalid or out-of-bounds range or cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Oura is not connected}
  /oura/collections/{collection}:
    get:
      operationId: getCollection
      parameters:
        - name: collection
          in: path
          required: true
          schema: {type: string, enum: [sleep, daily_sleep, daily_readiness, daily_activity]}
        - {$ref: '#/components/parameters/start'}
        - {$ref: '#/components/parameters/end'}
        - {$ref: '#/components/parameters/cursor'}
      responses:
        '200': {$ref: '#/components/responses/Records'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unsupported collection}
        '409': {description: Oura is not connected}
  /oura/sync:
    get:
      operationId: getSyncStatus
      responses:
        '200': {description: Job counts by processing status}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: enqueueSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                start: {type: string, format: date}
                end: {type: string, format: date}
      responses:
        '202': {description: Repair jobs durably queued}
        '400': {description: Invalid JSON or date range}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Account linking or relinking required}
        '429': {description: Rate limited; observe Retry-After}
  /oura/connection:
    get:
      operationId: getOuraConnection
      responses:
        '200': {description: Connection status and collection coverage}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /oura/webhooks:
    get:
      operationId: verifyOuraWebhook
      security: []
      parameters:
        - {name: verification_token, in: query, required: true, schema: {type: string}}
        - {name: challenge, in: query, required: true, schema: {type: string, maxLength: 512}}
      responses:
        '200': {description: Verified challenge echoed as JSON}
        '401': {description: Verification failed}
    post:
      operationId: receiveOuraWebhook
      description: Requires valid x-oura-signature and x-oura-timestamp headers. Maximum body 64 KiB.
      security: []
      responses:
        '200': {description: Known account event durably queued, or duplicate/unknown account ignored}
        '400': {description: Invalid event}
        '401': {description: Invalid signature or timestamp}
        '413': {description: Body too large}
        '500': {description: Persistence failed; delivery must be retried}
  /oura/oauth/callback:
    get:
      operationId: completeOuraSetup
      description: Completes a single-use ten-minute transaction created only by the operator CLI. No browser UI.
      security: []
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
      responses:
        '200': {description: Account connected; history import queued}
        '400': {description: Authorization failed or expired}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: One private API_TOKEN for this single-person API.
  schemas:
    EufyCache:
      type: object
      properties:
        fetched_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ttl_seconds: {type: integer, enum: [300]}
    EufyMeasurement:
      type: object
      description: Missing or zero source metrics are null. Weight is in kilograms; uncertain source fields are omitted.
      properties:
        id: {type: string}
        customer_id: {type: string}
        device_id: {type: string}
        product_code: {type: string}
        timestamp: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        weight_kg: {type: number, nullable: true}
        bmi: {type: number, nullable: true}
        body_fat_percent: {type: number, nullable: true}
        body_fat_mass_kg: {type: number, nullable: true}
        muscle_mass_kg: {type: number, nullable: true}
        skeletal_muscle_mass_kg: {type: number, nullable: true}
        bone_mass_kg: {type: number, nullable: true}
        water_percent: {type: number, nullable: true}
        subcutaneous_fat_percent: {type: number, nullable: true}
        visceral_fat_level: {type: number, nullable: true}
        bmr_kcal_per_day: {type: number, nullable: true}
        body_age_years: {type: number, nullable: true}
        protein_percent: {type: number, nullable: true}
        heart_rate_bpm: {type: number, nullable: true}
  parameters:
    eufyCustomer:
      name: customer_id
      in: query
      schema: {type: string, maxLength: 256}
      description: Eufy Life member ID from /eufy/members.
    start:
      name: start
      in: query
      schema: {type: string, format: date}
      description: Inclusive start date. Default 30 days before the exclusive end.
    end:
      name: end
      in: query
      schema: {type: string, format: date}
      description: Exclusive end date. Default tomorrow UTC. Maximum read range 90 days.
    cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
      description: Opaque next_cursor from the previous response, keeping the same dates.
  responses:
    Unauthorized:
      description: Missing or invalid Authorization bearer token.
    Records:
      description: Up to 500 source records with freshness and coverage metadata.
      content:
        application/json:
          schema:
            type: object
            properties:
              source: {type: string, enum: [oura]}
              start: {type: string, format: date}
              end_exclusive: {type: string, format: date}
              connection_status: {type: string}
              next_cursor: {type: string}
              coverage: {type: array, items: {type: object, additionalProperties: true}}
              data:
                type: array
                items:
                  type: object
                  properties:
                    collection: {type: string}
                    id: {type: string}
                    day: {type: string, format: date-time, nullable: true}
                    fetched_at: {type: string, format: date-time}
                    data: {type: object, additionalProperties: true}
